name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create GitHub Releases
  packages: write   # push to GitHub Packages

jobs:
  release:
    runs-on: windows-latest   # net472 + WinForms tests need the .NET Framework runtime (Windows only)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($version -match '-') {
            "IS_PRERELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "IS_PRERELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          Write-Host "Releasing $version (prerelease=$($version -match '-'))"

      - name: Restore
        run: dotnet restore Kibinago.sln

      - name: Build (Release)
        shell: pwsh
        run: dotnet build Kibinago.sln -c Release --no-restore -p:Version=$env:VERSION

      # One command per step: in PowerShell (the Windows default) a multi-line run only fails
      # on the last command's exit code.
      - name: Test gate (samples)
        run: dotnet test tests/Kibinago.Samples.Tests/Kibinago.Samples.Tests.csproj -c Release --no-build

      - name: Test gate (analyzers)
        run: dotnet test tests/Kibinago.Analyzers.Tests/Kibinago.Analyzers.Tests.csproj -c Release --no-build

      - name: Pack
        shell: pwsh
        run: |
          dotnet pack src/Kibinago.Core/Kibinago.Core.csproj -c Release -p:Version=$env:VERSION -o artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Kibinago/Kibinago.csproj -c Release -p:Version=$env:VERSION -o artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Kibinago.DependencyInjection/Kibinago.DependencyInjection.csproj -c Release -p:Version=$env:VERSION -o artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Kibinago.Testing/Kibinago.Testing.csproj -c Release -p:Version=$env:VERSION -o artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack templates/Kibinago.Templates.csproj -c Release -p:Version=$env:VERSION -o artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert analyzer is bundled in the core package
        shell: pwsh
        run: |
          $pkg = Get-ChildItem "artifacts/Kibinago.Core.[0-9]*.nupkg" | Select-Object -First 1
          if (-not $pkg) { throw "Core package not found in artifacts" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -eq 'analyzers/dotnet/cs/Kibinago.Analyzers.dll' }
          } finally {
            $zip.Dispose()
          }
          if (-not $entry) { throw "Analyzer DLL missing from $($pkg.Name) - expected analyzers/dotnet/cs/Kibinago.Analyzers.dll" }
          Write-Host "OK: analyzer bundled in $($pkg.Name)"

      - name: Assert XML docs are packed next to every library
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($id in 'Kibinago.Core', 'Kibinago', 'Kibinago.DependencyInjection', 'Kibinago.Testing') {
            $pkg = Get-ChildItem "artifacts/$id.[0-9]*.nupkg" | Select-Object -First 1
            if (-not $pkg) { throw "$id package not found in artifacts" }
            $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
            try {
              $dlls = $zip.Entries | Where-Object { $_.FullName -like "lib/*/$id.dll" }
              if (-not $dlls) { throw "No lib/*/$id.dll in $($pkg.Name)" }
              foreach ($dll in $dlls) {
                $xml = $dll.FullName -replace '\.dll$', '.xml'
                if (-not ($zip.Entries | Where-Object { $_.FullName -eq $xml })) { throw "XML docs missing from $($pkg.Name) - expected $xml" }
              }
            } finally {
              $zip.Dispose()
            }
            Write-Host "OK: XML docs packed in $($pkg.Name)"
          }

      - name: Push to GitHub Packages
        shell: pwsh
        # dotnet nuget push does not expand a quoted wildcard path on its own; enumerate the files explicitly.
        run: |
          Get-ChildItem artifacts/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem artifacts/*.nupkg | ForEach-Object { $_.FullName }
          $exists = gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release ${{ github.ref_name }} already exists; uploading assets with --clobber"
            foreach ($f in $files) { gh release upload "${{ github.ref_name }}" $f --clobber }
          } else {
            $ghArgs = @("${{ github.ref_name }}") + $files + @('--title', "${{ github.ref_name }}", '--generate-notes')
            if ($env:IS_PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
            gh release create @ghArgs
          }
