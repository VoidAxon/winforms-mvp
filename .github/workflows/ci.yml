name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest   # net48 tests need the .NET Framework runtime (Windows only)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore winforms-mvp.sln

      - name: Build
        run: dotnet build winforms-mvp.sln -c Release --no-restore

      # One command per step: in PowerShell (the Windows default) a multi-line run only fails
      # on the last command's exit code.
      - name: Test (samples)
        run: dotnet test tests/WinformsMVP.Samples.Tests/WinformsMVP.Samples.Tests.csproj -c Release --no-build

      - name: Test (analyzers)
        run: dotnet test tests/WinformsMVP.Analyzers.Tests/WinformsMVP.Analyzers.Tests.csproj -c Release --no-build

      # Generates an app, windows, a control and a test project from the templates for both
      # target frameworks, builds them warning-free and runs the generated tests.
      - name: Templates
        shell: bash
        env:
          RUN_TESTS: '1'
        run: tests/templates/verify-templates.sh
