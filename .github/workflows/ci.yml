name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest   # net48 tests need the .NET Framework runtime (Windows only)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore winforms-mvp.sln

      - name: Build
        run: dotnet build winforms-mvp.sln -c Release --no-restore

      - name: Test
        run: |
          dotnet test tests/WinformsMVP.Samples.Tests/WinformsMVP.Samples.Tests.csproj -c Release --no-build
          dotnet test tests/WinformsMVP.Analyzers.Tests/WinformsMVP.Analyzers.Tests.csproj -c Release --no-build
